# Baut die App bei jeder Änderung auf "main" und veröffentlicht sie auf GitHub Pages.
name: Auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci
        timeout-minutes: 5

      - name: Automatische Tests (inkl. Würfel-Engine)
        run: npm test
        timeout-minutes: 5

      - name: Öffentliche Version bauen (ohne persönliche Startdaten)
        run: npm run build
        env:
          PUBLIC_BUILD: "1"

      - name: Datenschutz-Prüfung
        run: |
          # Persönliche Startdaten tragen eine Markierung und liegen in src/seed/private/ (nie im Repo, nie im Build).
          if [ -n "$(git ls-files src/seed/private)" ]; then
            echo "src/seed/private ist im Repository – Abbruch."; exit 1
          fi
          if grep -rq "skills-private-seed-7f3a" dist; then
            echo "Persönliche Startdaten im Build gefunden – Abbruch."; exit 1
          fi
          if grep -rqE "window[.](db|app)[ ]*=" dist/assets; then
            echo "Test-Zugang (window.db) im Build gefunden – Abbruch."; exit 1
          fi
          # Die öffentliche Bibliothek (src/library) darf keine Sessions, Notizen, To-dos usw. enthalten.
          if grep -rqiE "(sessions|todos|inbox|wishes)[^a-z]{1,3}:" src/library; then
            echo "Persönliche Daten in src/library – Abbruch."; exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ---- Schnelle, wichtige Tests (blockieren die Veröffentlichung) ----
  # Überlauf/Layout und Fehler-Tests in Chromium
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
        timeout-minutes: 5
      - name: Chromium installieren
        run: npx playwright-core install --with-deps chromium
        timeout-minutes: 5
      - name: Browser-Tests (Überlauf, Fehler-Tests)
        run: mkdir -p test-results/overflow && npm run test:browser
        timeout-minutes: 12
        env:
          CI: "true"
          SHOTS: test-results/overflow
      - name: Ergebnisse bei Fehlern speichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testergebnisse-browser
          path: test-results
          if-no-files-found: ignore
          retention-days: 14

  # Szenarien und Layout-Matrix (leichte Variante) in Chromium
  e2e-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
        timeout-minutes: 5
      - name: Chromium installieren
        run: npx playwright-core install --with-deps chromium
        timeout-minutes: 5
      - name: Szenarien und Layout-Matrix (Chromium)
        run: npm run test:e2e
        timeout-minutes: 12
        env:
          CI: "true"
          ENGINES: chromium
          SUITES: scenarios,matrix
          QUICK: "1"
          SUITE_TIMEOUT_MIN: "5"
      - name: Ergebnisse bei Fehlern speichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testergebnisse-core
          path: test-results
          if-no-files-found: ignore
          retention-days: 14

  # ---- Schwere Tests (3D-Würfel, Affentest, WebKit): laufen parallel, melden Fehler, blockieren die Veröffentlichung nicht ----
  e2e-heavy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
        timeout-minutes: 5
      - name: Browser installieren
        run: npx playwright-core install --with-deps ${{ matrix.engine }}
        timeout-minutes: 6
      - name: Würfel-3D-Tests und Affentest (leichte Variante)
        run: npm run test:e2e
        timeout-minutes: 11
        env:
          CI: "true"
          LIGHT: "1"
          ENGINES: ${{ matrix.engine }}
          SUITES: ${{ matrix.engine == 'webkit' && 'scenarios,cube,monkey' || 'cube,monkey' }}
          SEEDS: "11"
          ACTIONS: "80"
          QUICK: "1"
          SUITE_TIMEOUT_MIN: "5"
      - name: Ergebnisse bei Fehlern speichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testergebnisse-schwer-${{ matrix.engine }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    timeout-minutes: 10
    needs: [build, browser, e2e-core]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
