# Baut die App bei jeder Änderung auf "main" und veröffentlicht sie auf GitHub Pages.
name: Auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Automatische Tests
        run: npm test

      - name: Öffentliche Version bauen (ohne persönliche Startdaten)
        run: npm run build
        env:
          PUBLIC_BUILD: "1"

      - name: Datenschutz-Prüfung
        run: |
          # Persönliche Startdaten tragen eine Markierung und liegen in src/seed/private/ (nie im Repo, nie im Build).
          if [ -n "$(git ls-files src/seed/private)" ]; then
            echo "src/seed/private ist im Repository – Abbruch."; exit 1
          fi
          if grep -rq "skills-private-seed-7f3a" dist; then
            echo "Persönliche Startdaten im Build gefunden – Abbruch."; exit 1
          fi
          if grep -rqE "window[.](db|app)[ ]*=" dist/assets; then
            echo "Test-Zugang (window.db) im Build gefunden – Abbruch."; exit 1
          fi
          # Die öffentliche Bibliothek (src/library) darf keine Sessions, Notizen, To-dos usw. enthalten.
          if grep -rqiE "(sessions|todos|inbox|wishes)[^a-z]{1,3}:" src/library; then
            echo "Persönliche Daten in src/library – Abbruch."; exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Selbsttests in Chromium und WebKit: Szenarien, Layout-Matrix, Affentest. Schlägt etwas fehl, wird NICHT veröffentlicht.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Browser installieren (Chromium und WebKit)
        run: npx playwright-core install --with-deps chromium webkit

      - name: Browser-Tests (Überlauf, Fehler-Tests)
        run: mkdir -p test-results/overflow && npm run test:browser
        env:
          CI: "true"
          SHOTS: test-results/overflow

      - name: Selbsttests (Szenarien, Matrix, Affentest)
        run: npm run test:e2e
        env:
          CI: "true"
          SEEDS: "11,22,33"
          ACTIONS: "300"

      - name: Screenshots und Bericht bei Fehlern speichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testergebnisse
          path: test-results
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
